<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Rewards Navigator</title><meta name="theme-color" content="#070812"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#070812;--cyan:#00f5ff;--pink:#ff3cac;--lime:#a3ff12;--text:#edf7ff;--muted:#9aa8c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#18255b 0%,transparent 30%),radial-gradient(circle at 100% 20%,#4b1248 0%,transparent 25%),var(--bg)}header{text-align:center;padding:30px 16px 18px}h1{margin:0;font-size:clamp(1.8rem,5vw,3.1rem);background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--muted);margin:9px 0}.container{max-width:1150px;margin:auto;padding:0 16px 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 20px}.tab{border:1px solid #34406f;background:#10152e;color:#dce9ff;padding:14px 8px;border-radius:13px;font-weight:800;font-size:.96rem;cursor:pointer}.tab.active{color:#06131b;background:linear-gradient(100deg,var(--cyan),#8dfff4);border-color:var(--cyan);box-shadow:0 0 20px #00f5ff66}.tools{display:grid;grid-template-columns:1fr 230px;gap:10px;margin-bottom:18px}.search,.filter{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #2d3766;background:#0d1023;color:white;font-size:1rem;outline:none}.search:focus,.filter:focus{border-color:var(--cyan);box-shadow:0 0 18px #00f5ff44}.filter-wrap{display:none}.filter-wrap.show{display:block}.section-title{color:var(--cyan);margin:10px 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}.card{background:linear-gradient(145deg,#171c3c,#0d1025);border:1px solid #303a69;border-radius:17px;padding:18px;box-shadow:0 8px 25px #0004}.card h3{margin:0 0 13px;color:white;font-size:1.12rem}.benefit-row{display:grid;grid-template-columns:minmax(115px, .8fr) 1.5fr;gap:10px;padding:10px 8px;margin:5px 0;border-radius:9px;background:#ffffff08;line-height:1.4;font-size:.92rem}.benefit-name{color:var(--cyan);font-weight:750}.benefit-value{color:#d3def2}.na{color:#8490a9}.voucher-head,.voucher-row{display:grid;grid-template-columns:1.05fr 1fr .65fr 1.5fr;gap:8px;align-items:start}.voucher-head{color:var(--cyan);font-weight:800;font-size:.8rem;padding:0 8px 9px;border-bottom:1px solid #34406f}.voucher-row{padding:12px 8px;border-bottom:1px solid #ffffff12;color:#d3def2;font-size:.9rem;line-height:1.4}.voucher-row:last-child{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:28px}.footer{text-align:center;color:#6f7b9e;padding:20px}@media(max-width:650px){.tools{grid-template-columns:1fr}.filter-wrap.show{display:block}.benefit-row{grid-template-columns:1fr;gap:4px}.voucher-head,.voucher-row{grid-template-columns:1fr 1fr;gap:7px}.voucher-head span:nth-child(n+3),.voucher-row span:nth-child(n+3){margin-top:3px}.voucher-head span:nth-child(3):before{content:"Cap: "}.voucher-head span:nth-child(4):before{content:"Conditions: "}.tab{font-size:.83rem;padding:12px 4px}}
</style></head><body><header><h1>⚡ Card Rewards Navigator</h1><p>Your card benefits, rewards, vouchers and limits in one place.</p></header><main class="container"><nav class="tabs" aria-label="Card information tabs"><button class="tab active" data-tab="Voucher Details" onclick="selectTab('Voucher Details')">🎁 Vouchers</button><button class="tab" data-tab="Debit Cards" onclick="selectTab('Debit Cards')">🏧 Debit</button><button class="tab" data-tab="Credit Cards" onclick="selectTab('Credit Cards')">💳 Credit</button></nav><div class="tools"><input class="search" id="search" type="search" placeholder="🔍 Search cards or benefits..." oninput="render()"><div class="filter-wrap" id="filterWrap"><select class="filter" id="categoryFilter" onchange="render()"><option value="">All benefit categories</option></select></div></div><h2 class="section-title" id="sectionTitle">🎁 Voucher Details</h2><div class="cards" id="cards"></div></main><div class="footer">Personal card benefits dashboard</div><script>
let data={},activeTab="Voucher Details";async function loadData(){try{const r=await fetch("./card-details.json",{cache:"no-store"});if(!r.ok)throw Error("Could not load card details");data=await r.json();buildFilter();render()}catch(e){document.getElementById("cards").innerHTML='<div class="empty">Unable to load card details. Please refresh and try again.</div>';console.error(e)}}
function buildFilter(){const s=document.getElementById("categoryFilter");(data["Benefit Categories"]||[]).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;s.appendChild(o)})}
function selectTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("search").value="";document.getElementById("categoryFilter").value="";const f=document.getElementById("filterWrap");f.classList.toggle("show",tab!=="Voucher Details");document.getElementById("search").placeholder=tab==="Voucher Details"?"🔍 Search vouchers...":"🔍 Search cards or benefits...";render()}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const root=document.getElementById("cards"),q=document.getElementById("search").value.toLowerCase(),filter=document.getElementById("categoryFilter").value,icons={"Voucher Details":"🎁","Debit Cards":"🏧","Credit Cards":"💳"};document.getElementById("sectionTitle").textContent=icons[activeTab]+" "+activeTab;
if(activeTab==="Voucher Details"){const rows=(data[activeTab]||[]).filter(x=>(x.card+" "+x.reward+" "+x.cap+" "+x.conditions).toLowerCase().includes(q));root.innerHTML=rows.length?'<article class="card"><div class="voucher-head"><span>Card</span><span>Reward</span><span>Cap</span><span>Conditions</span></div>'+rows.map(x=>'<div class="voucher-row"><span>'+escapeHTML(x.card)+'</span><span>'+escapeHTML(x.reward)+'</span><span>'+escapeHTML(x.cap)+'</span><span>'+escapeHTML(x.conditions)+'</span></div>').join("")+'</article>':'<div class="empty">No matching vouchers found.</div>';return}
const list=(data[activeTab]||[]).filter(c=>{const vals=Object.entries(c.benefits);const categoryMatch=!filter||c.benefits[filter]!=="NA";const textMatch=(c.card+" "+vals.map(([k,v])=>k+" "+v).join(" ")).toLowerCase().includes(q);return categoryMatch&&textMatch});
root.innerHTML=list.map(c=>{const entries=Object.entries(c.benefits).filter(([k,v])=>(!filter||k===filter)&&(!q||(k+" "+v).toLowerCase().includes(q)));return '<article class="card"><h3>'+escapeHTML(c.card)+'</h3>'+entries.map(([k,v])=>'<div class="benefit-row"><span class="benefit-name">'+escapeHTML(k)+'</span><span class="benefit-value '+(v==="NA"?"na":"")+'">'+escapeHTML(v)+'</span></div>').join("")+'</article>'}).join("")||'<div class="empty">No cards match this filter.</div>'}
loadData();</script><script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script></body></html>
