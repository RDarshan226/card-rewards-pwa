<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Rewards Navigator</title><meta name="theme-color" content="#070812"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#070812;--cyan:#00f5ff;--pink:#ff3cac;--lime:#a3ff12;--text:#edf7ff;--muted:#9aa8c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#18255b 0%,transparent 30%),radial-gradient(circle at 100% 20%,#4b1248 0%,transparent 25%),var(--bg)}header{text-align:center;padding:30px 16px 18px}h1{margin:0;font-size:clamp(1.8rem,5vw,3.1rem);background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--muted);margin:9px 0}.container{max-width:1150px;margin:auto;padding:0 16px 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 20px}.tab{border:1px solid #34406f;background:#10152e;color:#dce9ff;padding:14px 8px;border-radius:13px;font-weight:800;font-size:.96rem;cursor:pointer}.tab.active{color:#06131b;background:linear-gradient(100deg,var(--cyan),#8dfff4);border-color:var(--cyan);box-shadow:0 0 20px #00f5ff66}.search{width:100%;padding:14px 17px;border-radius:14px;border:1px solid #2d3766;background:#0d1023;color:white;font-size:1rem;outline:none;margin-bottom:18px}.search:focus{border-color:var(--cyan);box-shadow:0 0 18px #00f5ff44}.section-title{color:var(--cyan);margin:10px 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.card{background:linear-gradient(145deg,#171c3c,#0d1025);border:1px solid #303a69;border-radius:17px;padding:18px;box-shadow:0 8px 25px #0004}.card h3{margin:0 0 13px;color:white;font-size:1.12rem}.benefits{list-style:none;margin:0;padding:0}.benefits li{position:relative;padding:9px 8px 9px 20px;margin:5px 0;border-radius:9px;background:#ffffff08;color:#cbd6ed;line-height:1.45;font-size:.94rem}.benefits li:before{content:"✦";position:absolute;left:7px;color:var(--lime)}.empty{text-align:center;color:var(--muted);padding:28px}.footer{text-align:center;color:#6f7b9e;padding:20px}@media(max-width:480px){.tabs{gap:6px}.tab{font-size:.83rem;padding:12px 4px}.card{padding:15px}}</style></head><body><header><h1>⚡ Card Rewards Navigator</h1><p>Your card benefits, rewards, vouchers and limits in one place.</p></header><main class="container"><nav class="tabs" aria-label="Card information tabs"><button class="tab active" data-tab="Voucher Details" onclick="selectTab('Voucher Details')">🎁 Vouchers</button><button class="tab" data-tab="Debit Cards" onclick="selectTab('Debit Cards')">🏧 Debit</button><button class="tab" data-tab="Credit Cards" onclick="selectTab('Credit Cards')">💳 Credit</button></nav><input class="search" id="search" type="search" placeholder="🔍 Search cards or benefits..." oninput="render()"><h2 class="section-title" id="sectionTitle">🎁 Voucher Details</h2><div class="cards" id="cards"></div></main><div class="footer">Personal card benefits dashboard</div><script>
let data={},activeTab="Voucher Details";async function loadData(){try{const r=await fetch("./card-details.json",{cache:"no-store"});if(!r.ok)throw Error("Could not load card details");data=await r.json();render()}catch(e){document.getElementById("cards").innerHTML='<div class="empty">Unable to load card details. Please refresh and try again.</div>';console.error(e)}}
function selectTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("search").value="";render()}
function render(){const root=document.getElementById("cards"),q=document.getElementById("search").value.toLowerCase(),icons={"Voucher Details":"🎁","Debit Cards":"🏧","Credit Cards":"💳"};document.getElementById("sectionTitle").textContent=icons[activeTab]+" "+activeTab;const list=(data[activeTab]||[]).filter(c=>(c.card+" "+c.details.join(" ")).toLowerCase().includes(q));root.innerHTML=list.map(c=>'<article class="card"><h3>'+escapeHTML(c.card)+'</h3><ul class="benefits">'+c.details.filter(x=>!q||x.toLowerCase().includes(q)).map(x=>'<li>'+escapeHTML(x)+'</li>').join("")+'</ul></article>').join("")||'<div class="empty">No matching cards or benefits found.</div>'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}loadData();</script><script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script></body></html>
