<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Rewards Navigator</title>
<style>
:root{
  --bg:#070812; --panel:#101326; --panel2:#151936;
  --cyan:#00f5ff; --pink:#ff3cac; --purple:#8b5cf6;
  --lime:#a3ff12; --text:#edf7ff; --muted:#9aa8c5;
}
*{box-sizing:border-box}
body{
 margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; color:var(--text);
 background:radial-gradient(circle at 20% 0%,#18255b 0%,transparent 30%),
            radial-gradient(circle at 100% 20%,#4b1248 0%,transparent 25%),var(--bg);
 min-height:100vh;
}
header{text-align:center;padding:38px 20px 22px}
h1{margin:0;font-size:clamp(2rem,5vw,3.6rem);letter-spacing:1px;
 background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));
 -webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--muted);margin:10px 0 0}
.container{max-width:1250px;margin:auto;padding:0 18px 45px}
.search-wrap{position:sticky;top:10px;z-index:10;margin:12px 0 24px}
input{
 width:100%;padding:16px 20px;border-radius:16px;border:1px solid #2d3766;
 background:#0d1023eF;color:white;font-size:1rem;outline:none;
 box-shadow:0 0 25px #00f5ff22;backdrop-filter:blur(10px)
}
input:focus{border-color:var(--cyan);box-shadow:0 0 20px #00f5ff55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.category{
 cursor:pointer;min-height:125px;padding:22px;border-radius:18px;
 background:linear-gradient(145deg,#141a38,#0c0f22);
 border:1px solid #29335d;position:relative;overflow:hidden;
 transition:.25s transform,.25s box-shadow,.25s border;
}
.category:before{content:"";position:absolute;inset:-2px;background:linear-gradient(135deg,var(--cyan),transparent 35%,var(--pink));opacity:.35}
.category>*{position:relative}
.category:hover,.category.active{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 0 22px #00f5ff44,0 0 35px #ff3cac22}
.icon{font-size:1.8rem}.category h3{margin:10px 0 4px}.category small{color:var(--muted)}
.details{margin-top:26px;display:none;background:#0e1127e8;border:1px solid #34406f;border-radius:22px;padding:24px;box-shadow:0 0 35px #8b5cf633}
.details.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.details-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.details h2{margin:0;color:var(--cyan)}
.close{cursor:pointer;background:#20284d;color:white;border:1px solid #56669e;border-radius:9px;padding:8px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.card{background:linear-gradient(145deg,#171c3c,#0d1025);border:1px solid #303a69;border-radius:16px;padding:18px;transition:.2s}
.card:hover{border-color:var(--pink);box-shadow:0 0 20px #ff3cac33}
.card h3{margin:0 0 12px;color:#fff}
.rate{display:inline-block;font-size:1.45rem;font-weight:800;color:var(--lime);text-shadow:0 0 10px #a3ff1266;margin-bottom:10px}
.row{margin:8px 0;color:#c5cee5;font-size:.92rem}.label{color:var(--cyan);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:#6f7b9e;padding:25px}
.tab-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.tab-btn{border:1px solid #34406f;background:#10152d;color:#b9c7e8;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer}
.tab-btn.active{color:var(--cyan);border-color:var(--cyan);background:#10233a;box-shadow:0 0 18px #00f5ff33}
.tab-panel{display:none}.tab-panel.active{display:block}
.card-filters{display:grid;grid-template-columns:minmax(0,2fr) minmax(180px,1fr);gap:12px;margin:12px 0 22px}
.card-filters select{width:100%;padding:15px 16px;border-radius:14px;border:1px solid #2d3766;background:#0d1023;color:white;font-size:1rem;outline:none}
.benefit-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.benefit-card{background:linear-gradient(145deg,#171c3c,#0d1025);border:1px solid #303a69;border-radius:16px;padding:18px}
.benefit-card h3{color:#fff;margin:0 0 14px}
.benefit-row{padding:9px 0;border-top:1px solid #293253;color:#c5cee5;font-size:.9rem;line-height:1.45}
.benefit-row strong{display:block;color:var(--cyan);margin-bottom:3px}
@media(max-width:600px){.card-filters{grid-template-columns:1fr}}

.modal{
 display:none; position:fixed; inset:0; z-index:100;
 background:rgba(3,5,16,.82); backdrop-filter:blur(10px);
 padding:20px; overflow:auto;
}
.modal.show{display:flex;align-items:center;justify-content:center;animation:fade .2s ease}
.modal-content{
 width:min(1050px,100%); max-height:90vh; overflow:auto;
 background:linear-gradient(145deg,#101632,#090b1d);
 border:1px solid var(--cyan); border-radius:24px; padding:26px;
 box-shadow:0 0 25px #00f5ff55,0 0 70px #ff3cac33;
 animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(15px)}to{opacity:1;transform:none}}
body.modal-open{overflow:hidden}

@media(max-width:600px){header{padding-top:28px}.details{padding:17px}}

.splash-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#17265c 0%,#090c20 48%,#050610 100%);opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}.splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-content{padding:24px;animation:splashRise .8s ease both}.splash-logo{width:94px;height:94px;margin:0 auto 22px;border:1px solid #00f5ff99;border-radius:27px;display:grid;place-items:center;font-size:3.4rem;color:var(--cyan);background:linear-gradient(145deg,#14294b,#11132d);box-shadow:0 0 24px #00f5ff55,inset 0 0 20px #00f5ff22;animation:splashPulse 1.8s ease-in-out infinite}.splash-title{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}.splash-subtitle{margin-top:10px;color:#aab8d8;font-size:.95rem;letter-spacing:.08em}.splash-loader{width:150px;height:3px;margin:30px auto 0;border-radius:9px;background:#293354;overflow:hidden}.splash-loader:after{content:"";display:block;width:42%;height:100%;border-radius:9px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:splashLoad 1.1s ease-in-out infinite}@keyframes splashPulse{50%{box-shadow:0 0 36px #00f5ff99,inset 0 0 25px #00f5ff44;transform:scale(1.04)}}@keyframes splashRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes splashLoad{from{transform:translateX(-110%)}to{transform:translateX(260%)}}</style>

<meta name="theme-color" content="#070812">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="splash-screen" id="splashScreen" aria-label="Loading Card Rewards Navigator"><div class="splash-content"><div class="splash-logo">⚡</div><div class="splash-title">Card Rewards Navigator</div><div class="splash-subtitle">YOUR REWARDS. ONE PLACE.</div><div class="splash-loader"></div></div></div>
<header>
  <h1>⚡ Card Rewards Navigator</h1>
  <p>Select a spending category to discover the best card, rewards, caps and conditions.</p>
</header>

<div class="container">
 <nav class="tab-nav" aria-label="Card sections">
  <button class="tab-btn active" data-tab="voucherPanel" onclick="switchTab('voucherPanel',this)">🎁 Vouchers</button>
  <button class="tab-btn" data-tab="debitPanel" onclick="switchTab('debitPanel',this)">💳 Debit Cards</button>
  <button class="tab-btn" data-tab="creditPanel" onclick="switchTab('creditPanel',this)">💎 Credit Cards</button>
 </nav>
 <section class="tab-panel active" id="voucherPanel">
  <div class="search-wrap"><input id="search" placeholder="🔍 Search categories or cards..." oninput="filterCategories()"></div>
  <div class="grid" id="grid"></div>
  <div class="modal" id="modal" onclick="handleBackdrop(event)">
   <section class="modal-content">
    <div class="details-head"><h2 id="detailTitle"></h2><button class="close" onclick="closeDetails()">✕ Close</button></div>
    <div class="cards" id="cards"></div>
   </section>
  </div>
  <div class="footer">Interactive personal card rewards dashboard • Tap any category to explore</div>
 </section>
 <section class="tab-panel" id="debitPanel">
  <div class="card-filters">
   <input id="debitSearch" placeholder="🔍 Search debit cards or benefits..." oninput="renderCardTab('Debit Cards')">
   <select id="debitCategory" aria-label="Filter debit benefits" onchange="renderCardTab('Debit Cards')"><option value="">All benefit categories</option></select>
  </div>
  <div class="benefit-list" id="debitCards"></div>
 </section>
 <section class="tab-panel" id="creditPanel">
  <div class="card-filters">
   <input id="creditSearch" placeholder="🔍 Search credit cards or benefits..." oninput="renderCardTab('Credit Cards')">
   <select id="creditCategory" aria-label="Filter credit benefits" onchange="renderCardTab('Credit Cards')"><option value="">All benefit categories</option></select>
  </div>
  <div class="benefit-list" id="creditCards"></div>
 </section>
</div>

<script>
let data = {};
let cardDetails = {};
const splashStarted=Date.now();
function switchTab(id,button){
 document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
 document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
 document.getElementById(id).classList.add("active");button.classList.add("active");
 if(id==="debitPanel")renderCardTab("Debit Cards");
 if(id==="creditPanel")renderCardTab("Credit Cards");
}
function renderCardTab(type){
 const key=type==="Debit Cards"?"debit":"credit";
 const listId=key+"Cards",searchId=key+"Search",categoryId=key+"Category";
 const target=document.getElementById(listId),term=document.getElementById(searchId).value.toLowerCase();
 const category=document.getElementById(categoryId).value;
 const cards=cardDetails[type]||[];
 target.innerHTML="";
 const filtered=cards.filter(card=>{
  const benefits=card.benefits||{};
  return (!term||(card.card+" "+Object.entries(benefits).map(([k,v])=>k+" "+v).join(" ")).toLowerCase().includes(term))
   &&(!category||benefits[category]!==undefined);
 });
 filtered.forEach(card=>{
  const article=document.createElement("article");article.className="benefit-card";
  const rows=Object.entries(card.benefits||{}).filter(([name])=>!category||name===category)
   .map(([name,value])=>'<div class="benefit-row"><strong>'+escapeHTML(name)+'</strong>'+escapeHTML(value||"NA")+'</div>').join("");
  article.innerHTML="<h3>"+escapeHTML(card.card)+"</h3>"+rows;target.appendChild(article);
 });
 if(!filtered.length)target.innerHTML='<div class="empty">No matching cards or benefits found.</div>';
}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function populateBenefitFilters(){
 const categories=cardDetails["Benefit Categories"]||[];
 ["debitCategory","creditCategory"].forEach(id=>{
  const select=document.getElementById(id);
  categories.forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;select.appendChild(option);});
 });
}
function hideSplash(){const wait=Math.max(0,1000-(Date.now()-splashStarted));setTimeout(()=>document.getElementById("splashScreen")?.classList.add("hide"),wait)}
setTimeout(()=>document.getElementById("splashScreen")?.classList.add("hide"),7000);
async function loadRewardsData() {
  try {
    const [response, cardResponse] = await Promise.all([fetch("./rewards-data.json", {cache: "no-store"}),fetch("./card-details.json",{cache:"no-store"})]);
    if (!response.ok) throw new Error("Unable to load rewards data");
    data = await response.json();
    if(!cardResponse.ok) throw new Error("Unable to load card details");
    cardDetails = await cardResponse.json();
    populateBenefitFilters();
    render();
    hideSplash();
  } catch (error) {
    document.getElementById("grid").innerHTML =
      '<div class="empty">Unable to load reward data. Please check your connection and try again.</div>';
    console.error(error);
    hideSplash();
  }
}

function render(filter=""){
 const grid=document.getElementById("grid"); grid.innerHTML="";
 Object.entries(data).filter(([name,obj])=>{
   const text=(name+" "+obj.items.flat().join(" ")).toLowerCase();
   return text.includes(filter.toLowerCase());
 }).forEach(([name,obj])=>{
   const d=document.createElement("div");d.className="category";
   d.dataset.name=name;
   d.innerHTML=`<div class="icon">${obj.icon}</div><h3>${name}</h3><small>${obj.items.length} card option${obj.items.length>1?"s":""} • Click to view</small>`;
   d.onclick=()=>showDetails(name,d);grid.appendChild(d);
 });
 if(!grid.children.length)grid.innerHTML='<div class="empty">No matching category or card found.</div>';
}
function showDetails(name,el){
 document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 const d=data[name];
 document.getElementById("detailTitle").textContent=d.icon+" "+name;
 document.getElementById("cards").innerHTML=d.items.map(i=>`<article class="card">
 <h3>${i[0]}</h3><div class="rate">${i[1]}</div>
 <div class="row"><span class="label">Cap:</span> ${i[2]}</div>
 <div class="row"><span class="label">Conditions:</span> ${i[3]}</div>
 </article>`).join("");
 document.getElementById("modal").classList.add("show");
 document.body.classList.add("modal-open");
}
function closeDetails(){
 document.getElementById("modal").classList.remove("show");
 document.body.classList.remove("modal-open");
 document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
}
function handleBackdrop(event){
 if(event.target.id==="modal") closeDetails();
}
document.addEventListener("keydown", event=>{
 if(event.key==="Escape") closeDetails();
});
function filterCategories(){render(document.getElementById("search").value)}
loadRewardsData();
</script>
<script>
if ("serviceWorker" in navigator) {
 window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script></body>
</html>
