<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Rewards Navigator</title><meta name="theme-color" content="#070812"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#070812;--cyan:#00f5ff;--pink:#ff3cac;--lime:#a3ff12;--text:#edf7ff;--muted:#9aa8c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#18255b 0%,transparent 30%),radial-gradient(circle at 100% 20%,#4b1248 0%,transparent 25%),var(--bg)}header{text-align:center;padding:30px 16px 18px}h1{margin:0;font-size:clamp(1.8rem,5vw,3.1rem);background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--muted);margin:9px 0}.container{max-width:1150px;margin:auto;padding:0 16px 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 20px}.tab{border:1px solid #34406f;background:#10152e;color:#dce9ff;padding:14px 8px;border-radius:13px;font-weight:800;font-size:.96rem;cursor:pointer}.tab.active{color:#06131b;background:linear-gradient(100deg,var(--cyan),#8dfff4);border-color:var(--cyan);box-shadow:0 0 20px #00f5ff66}.tools{display:grid;grid-template-columns:1fr 230px;gap:10px;margin-bottom:18px}.search,.filter{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #2d3766;background:#0d1023;color:white;font-size:1rem;outline:none}.search:focus,.filter:focus{border-color:var(--cyan);box-shadow:0 0 18px #00f5ff44}.filter-wrap{display:none}.filter-wrap.show{display:block}.section-title{color:var(--cyan);margin:10px 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}.card{background:linear-gradient(145deg,#171c3c,#0d1025);border:1px solid #303a69;border-radius:17px;padding:18px;box-shadow:0 8px 25px #0004}.card h3{margin:0 0 13px;color:white;font-size:1.12rem}.benefit-row{display:grid;grid-template-columns:minmax(115px, .8fr) 1.5fr;gap:10px;padding:10px 8px;margin:5px 0;border-radius:9px;background:#ffffff08;line-height:1.4;font-size:.92rem}.benefit-name{color:var(--cyan);font-weight:750}.benefit-value{color:#d3def2}.na{color:#8490a9}.voucher-head,.voucher-row{display:grid;grid-template-columns:1.05fr 1fr .65fr 1.5fr;gap:8px;align-items:start}.voucher-head{color:var(--cyan);font-weight:800;font-size:.8rem;padding:0 8px 9px;border-bottom:1px solid #34406f}.voucher-row{padding:12px 8px;border-bottom:1px solid #ffffff12;color:#d3def2;font-size:.9rem;line-height:1.4}.voucher-row:last-child{border-bottom:0}.category-card{cursor:pointer;text-align:center;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.category-card:hover{border-color:var(--cyan);box-shadow:0 0 18px #00f5ff44}.category-icon{font-size:1.9rem}.category-name{font-weight:800;color:#eafaff}.modal{display:none;position:fixed;inset:0;z-index:20;background:#02040ddd;padding:16px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-panel{width:min(760px,100%);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#171c3c,#090d20);border:1px solid var(--cyan);border-radius:18px;padding:16px}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:#121831;padding:8px 0 12px}.modal-top h2{margin:0;color:var(--cyan)}.close-modal{border:1px solid #52618c;background:#10152e;color:white;border-radius:10px;padding:9px 13px}.reward-table{width:100%;border-collapse:collapse;font-size:.9rem}.reward-table th{color:var(--cyan);text-align:left}.reward-table th,.reward-table td{padding:10px 7px;border-bottom:1px solid #ffffff18;vertical-align:top}.subheading{color:var(--cyan);margin:24px 0 12px}.empty{text-align:center;color:var(--muted);padding:28px}.footer{text-align:center;color:#6f7b9e;padding:20px}@media(max-width:650px){.tools{grid-template-columns:1fr}.filter-wrap.show{display:block}.benefit-row{grid-template-columns:1fr;gap:4px}.voucher-head,.voucher-row{grid-template-columns:1fr 1fr;gap:7px}.voucher-head span:nth-child(n+3),.voucher-row span:nth-child(n+3){margin-top:3px}.voucher-head span:nth-child(3):before{content:"Cap: "}.voucher-head span:nth-child(4):before{content:"Conditions: "}.tab{font-size:.83rem;padding:12px 4px}}
</style></head><body><header><h1>⚡ Card Rewards Navigator</h1><p>Your card benefits, rewards, vouchers and limits in one place.</p></header><main class="container"><nav class="tabs" aria-label="Card information tabs"><button class="tab active" data-tab="Voucher Details" onclick="selectTab('Voucher Details')">🎁 Vouchers</button><button class="tab" data-tab="Debit Cards" onclick="selectTab('Debit Cards')">🏧 Debit</button><button class="tab" data-tab="Credit Cards" onclick="selectTab('Credit Cards')">💳 Credit</button></nav><div class="tools"><input class="search" id="search" type="search" placeholder="🔍 Search cards or benefits..." oninput="render()"><div class="filter-wrap" id="filterWrap"><select class="filter" id="categoryFilter" onchange="render()"><option value="">All benefit categories</option></select></div></div><h2 class="section-title" id="sectionTitle">🎁 Voucher Details</h2><div class="cards" id="cards"></div><h2 class="subheading" id="voucherHeading">Voucher offers</h2><div id="voucherRows"></div><div class="modal" id="categoryModal" onclick="if(event.target===this)closeCategory()"><div class="modal-panel"><div class="modal-top"><h2 id="modalTitle"></h2><button class="close-modal" onclick="closeCategory()">✕ Close</button></div><div id="modalContent"></div></div></div></main><div class="footer">Personal card benefits dashboard</div><script>
let data={},rewardData={},activeTab="Voucher Details";
async function loadData(){try{const a=await fetch("./card-details.json",{cache:"no-store"}),b=await fetch("./rewards-data.json",{cache:"no-store"});if(!a.ok||!b.ok)throw Error("Data unavailable");data=await a.json();rewardData=await b.json();buildFilter();render()}catch(e){document.getElementById("cards").innerHTML="<div class='empty'>Unable to load data. Refresh and try again.</div>";console.error(e)}}
function buildFilter(){const s=document.getElementById("categoryFilter");(data["Benefit Categories"]||[]).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;s.appendChild(o)})}
function selectTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("search").value="";document.getElementById("categoryFilter").value="";document.getElementById("filterWrap").classList.toggle("show",tab!=="Voucher Details");document.getElementById("search").placeholder=tab==="Voucher Details"?"Search categories or voucher details...":"Search cards or benefits...";closeCategory();render()}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openCategory(name){const c=rewardData[name];if(!c)return;document.getElementById("modalTitle").textContent=(c.icon||"✨")+" "+name;let body='<table class="reward-table"><thead><tr><th>Card</th><th>Reward</th><th>Cap</th><th>Conditions</th></tr></thead><tbody>';(c.items||[]).forEach(row=>{body+="<tr>";row.forEach(v=>body+="<td>"+esc(v)+"</td>");body+="</tr>"});body+="</tbody></table>";document.getElementById("modalContent").innerHTML=(c.items||[]).length?body:'<div class="empty">No reward details available.</div>';document.getElementById("categoryModal").classList.add("open")}
function closeCategory(){document.getElementById("categoryModal").classList.remove("open")}
document.getElementById("cards").addEventListener("click",e=>{const x=e.target.closest("[data-category]");if(x)openCategory(x.dataset.category)});
document.getElementById("cards").addEventListener("keydown",e=>{const x=e.target.closest("[data-category]");if(x&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openCategory(x.dataset.category)}});
function render(){const root=document.getElementById("cards"),q=document.getElementById("search").value.toLowerCase(),filter=document.getElementById("categoryFilter").value;document.getElementById("sectionTitle").textContent=activeTab==="Voucher Details"?"🎁 Voucher Details":activeTab;
if(activeTab==="Voucher Details"){const names=Object.keys(rewardData).filter(n=>(n+" "+(rewardData[n].items||[]).flat().join(" ")).toLowerCase().includes(q));root.innerHTML=names.map(n=>'<article class="card category-card" data-category="'+esc(n)+'" tabindex="0"><div class="category-icon">'+esc(rewardData[n].icon||"✨")+'</div><div class="category-name">'+esc(n)+'</div><div class="na">'+(rewardData[n].items||[]).length+' reward entries</div></article>').join("")||'<div class="empty">No matching categories found.</div>';document.getElementById("voucherHeading").style.display="block";const v=(data["Voucher Details"]||[]).filter(x=>(x.card+" "+x.reward+" "+x.cap+" "+x.conditions).toLowerCase().includes(q));document.getElementById("voucherRows").innerHTML=v.length?'<article class="card"><div class="voucher-head"><span>Card</span><span>Reward</span><span>Cap</span><span>Conditions</span></div>'+v.map(x=>'<div class="voucher-row"><span>'+esc(x.card)+'</span><span>'+esc(x.reward)+'</span><span>'+esc(x.cap)+'</span><span>'+esc(x.conditions)+'</span></div>').join("")+'</article>':'<div class="empty">No matching voucher offers.</div>';return}
document.getElementById("voucherHeading").style.display="none";document.getElementById("voucherRows").innerHTML="";
const list=(data[activeTab]||[]).filter(c=>{const vals=Object.entries(c.benefits);return (!filter||c.benefits[filter]!=="NA")&&(c.card+" "+vals.map(([k,v])=>k+" "+v).join(" ")).toLowerCase().includes(q)});
root.innerHTML=list.map(c=>{const entries=Object.entries(c.benefits).filter(([k,v])=>(!filter||k===filter)&&(!q||(k+" "+v).toLowerCase().includes(q)));return '<article class="card"><h3>'+esc(c.card)+'</h3>'+entries.map(([k,v])=>'<div class="benefit-row"><span class="benefit-name">'+esc(k)+'</span><span class="benefit-value '+(v==="NA"?"na":"")+'">'+esc(v)+'</span></div>').join("")+'</article>'}).join("")||'<div class="empty">No cards match this filter.</div>'}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCategory()});loadData();
</script><script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script></body></html>
